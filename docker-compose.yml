# Desenvolvimento: sobe apenas o PostgreSQL. As apps (web/api) rodam no host com `pnpm dev`.
# Dockerfiles das apps entram quando formos criar staging/produção (ver docs/DECISIONS.md, ADR-0009).

services:
  db:
    image: postgres:16-alpine
    container_name: projetox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projetox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projetox_dev}
      POSTGRES_DB: ${POSTGRES_DB:-projetox}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - projetox_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-projetox}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  projetox_db:
